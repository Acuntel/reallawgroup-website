limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name reallawgroup.com www.reallawgroup.com;
    return 301 https://reallawgroup.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.reallawgroup.com;

    ssl_certificate /etc/letsencrypt/live/reallawgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reallawgroup.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://reallawgroup.com$request_uri;
}

server {
    listen 443 ssl;
    server_name reallawgroup.com;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/reallawgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reallawgroup.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml application/xml font/woff2;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
